services:
  frontend:
    build: 
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3001:3000"
  
  backend:
    build: ../devops-bootcamp-linker-backend-main
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
  
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb-banana
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: